<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IndiaMART — Merged Homepage Prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    /* === IndiaMART Design System tokens === */
    --primary:#1d8480;
    --primary-light:hsl(178,45%,85%);
    --primary-hover:hsl(178,63%,25%);
    --primary-active:hsl(178,63%,20%);
    --primary-disabled:hsl(178,20%,70%);

    --secondary:#2e3192;
    --secondary-hover:hsl(239,52%,32%);
    --secondary-light:hsl(239,40%,92%);

    --neutral-900:hsl(220,14%,10%);
    --neutral-700:hsl(220,8%,35%);
    --neutral-600:hsl(220,6%,46%);
    --neutral-400:hsl(220,8%,72%);
    --neutral-300:hsl(220,10%,84%);
    --neutral-200:hsl(220,14%,92%);
    --neutral-100:hsl(220,20%,97%);

    --success:#1a9e56;
    --destructive:#dc3545;
    --warning:#e89c0c;
    --info:#2483d4;

    --badge-star:#eeb160;
    --badge-industry:#ca6c42;
    --badge-leading:#8ab0df;

    --background:hsl(220,20%,97%);
    --card:#ffffff;
    --border:hsl(220,10%,84%);
    --dark:#0f172a;

    --shadow-1:0 1px 3px 0 rgba(30,42,58,0.06);
    --shadow-2:0 4px 12px -2px rgba(30,42,58,0.08);
    --shadow-3:0 12px 32px -4px rgba(30,42,58,0.12);

    /* aliases used through the file, mapped onto the system above */
    --ink:var(--neutral-900);
    --teal:var(--primary);
    --teal-deep:var(--dark);
    --teal-mid:var(--primary-hover);
    --paper:var(--background);
    --line:var(--border);
    --amber:var(--warning);
    --amber-deep:#a96b15;
    --red:var(--destructive);
    --muted:var(--neutral-600);
    --green:var(--success);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;background:#DCD8CB;font-family:"Inter","Helvetica Neue",Arial,sans-serif;color:var(--ink);}
  .serif{font-family:"Inter","Helvetica Neue",Arial,sans-serif;}

  /* ===== Control deck ===== */
  .controls{
    max-width:900px;
    margin:0 auto;
    padding:18px 16px 10px;
  }
  .controls h1{
    font-size:16px;
    margin:0 0 2px;
    font-family:"Inter","Helvetica Neue",Arial,sans-serif;
  }
  .controls .sub{
    font-size:12.5px;
    color:#4B534F;
    margin:0 0 14px;
    line-height:1.5;
  }
  .control-group{
    margin-bottom:10px;
  }
  .control-label{
    font-size:10.5px;
    font-weight:700;
    letter-spacing:0.3px;
    color:#5B645F;
    margin-bottom:6px;
  }
  .pill-row{
    display:flex;
    gap:8px;
    flex-wrap:wrap;
  }
  .pill{
    border:1px solid #C9C4B4;
    background:#fff;
    padding:8px 13px;
    border-radius:20px;
    font-size:12px;
    font-weight:600;
    color:#3B423E;
    cursor:pointer;
    transition:all .15s ease;
  }
  .pill:hover{border-color:var(--teal);}
  .pill.active{
    background:var(--teal-deep);
    border-color:var(--teal-deep);
    color:#fff;
  }

  /* ===== Phone frame ===== */
  .stage{
    display:flex;
    justify-content:center;
    padding:6px 16px 60px;
  }
  .device{
    width:100%;
    max-width:390px;
    background:var(--paper);
    min-height:780px;
    border-radius:20px;
    overflow:hidden;
    box-shadow:0 20px 45px rgba(0,0,0,0.28);
    border:6px solid #14201D;
  }

  /* ===== Topbar ===== */
  .topbar{
    background:var(--primary);
    color:#fff;
    padding:10px 12px 8px;
  }
  .topbar-row{display:flex;align-items:center;gap:10px;}
  .hamburger{display:flex;flex-direction:column;gap:3px;padding:4px;flex-shrink:0;}
  .hamburger span{width:18px;height:2px;background:#fff;border-radius:1px;}
  .logo{
    display:flex;align-items:center;justify-content:center;gap:6px;flex:1;
  }
  .logo-badge{
    width:24px;height:24px;border-radius:6px;
    background:var(--red);
    color:#fff;
    display:flex;align-items:center;justify-content:center;
    font-weight:800;font-size:14px;
    font-family:"Inter","Helvetica Neue",Arial,sans-serif;
  }
  .logo-text{font-weight:700;font-size:15px;letter-spacing:0.2px;}
  .topbar-icons{display:flex;gap:14px;align-items:center;flex-shrink:0;}
  .name-chip{
    font-size:11px;background:rgba(255,255,255,0.12);
    padding:4px 9px;border-radius:12px;font-weight:600;
  }

  .search-wrap{padding:10px 12px 12px;}
  .search-box{
    background:#fff;border-radius:8px;
    display:flex;align-items:center;padding:10px 11px;gap:8px;
    box-shadow:0 3px 8px rgba(0,0,0,0.15);
  }
  .search-box input{
    border:none;outline:none;flex:1;font-size:13.5px;color:var(--ink);background:transparent;
  }
  .search-box input::placeholder{color:#9AA1AE;}
  .search-icons{display:flex;gap:9px;color:#8B8F86;}

  .location-line{
    font-size:11.5px;color:#DCEEEC;display:flex;align-items:center;gap:5px;padding:0 12px 10px;
    background:var(--primary);
  }
  .location-line b{color:#fff;}

  /* ===== Generic section ===== */
  .section{padding:16px 14px 4px;}
  .section-head{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:10px;}
  .section-title{font-family:"Inter","Helvetica Neue",Arial,sans-serif;font-size:16.5px;font-weight:700;color:var(--teal-deep);}
  .section-link{font-size:11.5px;color:var(--primary);font-weight:700;}

  /* quick actions (new user) */
  .quick-actions{display:flex;gap:8px;padding:14px 14px 4px;}
  .qa-card{
    flex:1;background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow-1);
    padding:14px 8px;text-align:center;
  }
  .qa-icon{color:var(--primary);margin-bottom:8px;}
  .qa-title{font-size:11.5px;font-weight:700;color:var(--ink);line-height:1.3;}
  .qa-sub{font-size:9.5px;color:var(--muted);margin-top:2px;}

  /* sign-in nudge */
  .nudge-banner{
    margin:12px 14px 0;background:#FCEFD8;border:1px solid #F0D6A3;
    border-radius:12px;padding:11px 12px;display:flex;align-items:center;gap:10px;
  }
  .nudge-icon{color:var(--amber-deep);flex-shrink:0;}
  .nudge-text{font-size:11.5px;line-height:1.4;color:#5B4420;flex:1;}
  .nudge-cta{font-size:11px;font-weight:700;color:var(--primary);white-space:nowrap;}

  /* RFQ status card */
  .rfq-hero{
    margin:12px 14px 0;background:var(--card);border:1px solid var(--line);border-radius:12px;
    padding:14px;box-shadow:var(--shadow-2);
  }
  .rfq-eyebrow{
    font-size:11px;font-weight:600;color:var(--muted);margin-bottom:12px;
  }
  .rfq-single{
    display:flex;align-items:center;gap:12px;margin-bottom:14px;
  }
  .rfq-single-photo{
    width:68px;height:68px;border-radius:10px;flex-shrink:0;position:relative;
    background:linear-gradient(135deg,#EDE7D8,#DACDA2);
    display:flex;align-items:center;justify-content:center;color:#B7AC8E;
  }
  .rfq-single-photo svg{width:28px;height:28px;}
  .rfq-photo-badge{
    position:absolute;top:-6px;right:-6px;background:var(--secondary);color:#fff;
    font-size:10px;font-weight:700;width:20px;height:20px;border-radius:50%;
    display:flex;align-items:center;justify-content:center;border:2px solid #fff;
  }
  .rfq-single-body{flex:1;min-width:0;}
  .rfq-item-name{font-size:14.5px;font-weight:700;color:var(--neutral-900);line-height:1.32;margin-bottom:3px;}
  .rfq-category{font-size:11px;color:var(--muted);margin-bottom:4px;}
  .rfq-sellers-text{font-size:11px;color:var(--muted);display:flex;align-items:center;}
  .rfq-status-dot{width:6px;height:6px;border-radius:50%;background:var(--success);display:inline-block;margin-right:6px;}
  .rfq-cta-full{
    background:var(--primary);color:#fff;font-size:12.5px;font-weight:700;text-align:center;
    padding:11px 12px;border-radius:8px;
  }

  /* expired rfq nudge */
  .expired-card{
    margin:12px 14px 0;background:#FBEAE8;border:1px solid #EFC3BD;border-radius:12px;padding:13px 13px;box-shadow:var(--shadow-1);
  }
  .expired-top{display:flex;align-items:center;gap:8px;margin-bottom:6px;}
  .expired-dot{width:7px;height:7px;border-radius:50%;background:var(--red);}
  .expired-label{font-size:11px;font-weight:700;color:var(--red);}
  .expired-title{font-size:13.5px;font-weight:700;color:var(--ink);margin-bottom:3px;}
  .expired-sub{font-size:11.5px;color:var(--muted);line-height:1.4;margin-bottom:10px;}
  .expired-cta{
    display:inline-block;background:var(--secondary);color:#fff;font-size:11.5px;font-weight:700;
    padding:8px 14px;border-radius:8px;
  }

  /* small banner variant (google landing, secondary priority) */
  .mini-banner{
    margin:10px 14px 0;background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow-1);
    padding:10px 11px;display:flex;align-items:center;gap:9px;
  }
  .mini-banner.urgent{border-color:var(--line);background:var(--neutral-100);}
  .mini-banner-icon{color:var(--teal);flex-shrink:0;}
  .mini-banner.urgent .mini-banner-icon{color:var(--muted);}
  .mini-banner.urgent .mini-banner-link{color:var(--primary);}
  .mini-banner-text{font-size:11.5px;line-height:1.4;flex:1;color:#3B423E;}
  .mini-banner-text b{color:var(--ink);}
  .mini-banner-link{font-size:10.5px;font-weight:700;color:var(--primary);white-space:nowrap;}

  /* feedback prompt */
  .feedback-card{
    margin:12px 14px 0;background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow-1);
    padding:11px 12px;display:flex;align-items:center;gap:10px;
    overflow:hidden;box-sizing:border-box;
    transition:max-height .38s ease, opacity .28s ease, margin-top .38s ease, margin-bottom .38s ease,
               padding-top .38s ease, padding-bottom .38s ease, border-color .28s ease;
  }
  .feedback-card.collapsed{
    opacity:0;margin-top:0;margin-bottom:0;padding-top:0;padding-bottom:0;border-color:transparent;box-shadow:none;
  }
  .feedback-avatar{
    width:32px;height:32px;border-radius:50%;background:#DDE7E4;flex-shrink:0;
    display:flex;align-items:center;justify-content:center;color:var(--teal);
  }
  .feedback-text{flex:1;font-size:11.5px;color:var(--ink);}
  .feedback-text .fq{font-weight:700;margin-bottom:1px;}
  .feedback-text .fs{color:var(--muted);font-size:10.5px;}
  .feedback-actions{display:flex;gap:7px;flex-shrink:0;}
  .fa-btn{
    width:26px;height:26px;border-radius:50%;border:1px solid var(--line);
    display:flex;align-items:center;justify-content:center;color:var(--muted);cursor:pointer;
    transition:background .2s ease, border-color .2s ease, color .2s ease, transform .12s ease;
  }
  .fa-btn:active{transform:scale(0.94);}
  .fa-btn-active{background:var(--destructive);border-color:var(--destructive);color:#fff;}

  /* quick links row (icon + label, under search) */
  .quicklinks-row{
    display:flex;justify-content:space-around;padding:2px 14px 14px;
  }
  .quicklink-item{display:flex;flex-direction:column;align-items:center;gap:6px;width:72px;}
  .quicklink-icon{
    width:42px;height:42px;border-radius:11px;background:var(--neutral-100);border:1px solid var(--line);
    display:flex;align-items:center;justify-content:center;color:var(--primary);
  }
  .quicklink-label{font-size:10px;font-weight:600;color:var(--neutral-900);text-align:center;line-height:1.25;}

  /* chip row (google guessed intent) */
  .chip-row{display:flex;gap:8px;overflow-x:auto;padding:10px 14px 2px;scrollbar-width:none;}
  .chip-row::-webkit-scrollbar{display:none;}
  .chip{
    flex-shrink:0;background:#fff;border:1px solid var(--primary-light);color:var(--primary);border-radius:16px;
    padding:7px 13px;font-size:11.5px;font-weight:600;color:var(--teal-deep);white-space:nowrap;
  }

  /* category rail */
  .cat-scroll{display:flex;gap:13px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none;}
  .cat-scroll::-webkit-scrollbar{display:none;}
  .cat-item{flex-shrink:0;width:68px;text-align:center;}
  .cat-icon{
    width:54px;height:54px;border-radius:50%;background:#fff;border:1px solid var(--line);
    display:flex;align-items:center;justify-content:center;margin:0 auto 5px;color:var(--teal);
  }
  .cat-label{font-size:10.5px;line-height:1.3;}

  /* industry explorer */
  .ind-group{margin-bottom:18px;}
  .ind-head{display:flex;align-items:center;gap:10px;margin-bottom:9px;}
  .ind-head-thumb{
    width:54px;height:54px;border-radius:50%;background:#fff;border:1px solid var(--line);
    display:flex;align-items:center;justify-content:center;color:var(--primary);flex-shrink:0;
  }
  .ind-head-thumb svg{width:24px;height:24px;}
  .ind-head-name{font-size:13.5px;font-weight:700;color:var(--neutral-900);line-height:1.3;font-family:"Inter","Helvetica Neue",Arial,sans-serif;}
  .ind-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px;}
  .ind-cell{
    background:var(--card);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow-1);
    padding:10px 9px;display:flex;align-items:center;gap:8px;min-height:52px;
  }
  .ind-thumb{
    width:34px;height:34px;border-radius:8px;background:var(--neutral-100);flex-shrink:0;
    display:flex;align-items:center;justify-content:center;color:var(--primary);
  }
  .ind-thumb svg{width:20px;height:20px;}
  .ind-label{font-size:11px;font-weight:600;color:var(--ink);line-height:1.3;}
  .ind-more{
    justify-content:center;align-items:center;color:var(--primary);font-weight:700;font-size:11.5px;
  }

  /* seller listing cards */
  .seller-card{
    background:var(--card);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow-1);
    padding:13px;margin-bottom:12px;
  }
  .seller-card:last-child{margin-bottom:0;}
  .seller-top{display:flex;gap:11px;}
  .seller-photo{
    width:78px;height:78px;border-radius:9px;flex-shrink:0;position:relative;
    background:linear-gradient(135deg,#EDE7D8,#DACDA2);
    display:flex;align-items:center;justify-content:center;color:#B7AC8E;
  }
  .seller-photo svg{width:26px;height:26px;}
  .seller-trust-badge{
    position:absolute;bottom:-7px;left:50%;transform:translateX(-50%);white-space:nowrap;
    background:#fff;border:1px solid var(--warning);color:var(--neutral-900);
    font-size:8.5px;font-weight:700;padding:2px 6px;border-radius:10px;
    display:flex;align-items:center;gap:3px;
  }
  .seller-trust-badge svg{color:var(--warning);width:9px;height:9px;}
  .seller-info{flex:1;min-width:0;}
  .seller-product-name{font-size:12.5px;font-weight:700;color:var(--secondary);line-height:1.3;margin-bottom:3px;}
  .seller-price{font-size:14.5px;font-weight:700;color:var(--neutral-900);margin-bottom:5px;}
  .seller-price span{font-size:10.5px;color:var(--muted);font-weight:400;margin-left:2px;}
  .seller-specs{font-size:10px;color:var(--muted);line-height:1.6;}
  .seller-specs b{color:var(--neutral-900);font-weight:600;}
  .seller-divider{height:1px;background:var(--line);margin:12px 0 10px;}
  .seller-company-row{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;margin-bottom:11px;}
  .seller-company-name{font-size:11.5px;font-weight:700;color:var(--neutral-900);}
  .seller-company-meta{font-size:10px;color:var(--muted);margin-top:2px;}
  .seller-rating-wrap{text-align:right;flex-shrink:0;}
  .seller-rating{display:flex;align-items:center;justify-content:flex-end;gap:4px;font-size:10.5px;color:var(--neutral-900);font-weight:600;}
  .seller-rating span{margin-left:1px;}
  .seller-response{
    font-size:9.5px;color:var(--muted);display:flex;align-items:center;justify-content:flex-end;gap:4px;margin-top:4px;
  }
  .seller-actions{display:flex;gap:7px;}
  .seller-btn{
    flex:1;display:flex;align-items:center;justify-content:center;gap:5px;
    font-size:10.5px;font-weight:700;padding:9px 6px;border-radius:8px;white-space:nowrap;
  }
  .seller-btn.primary{background:var(--primary);color:#fff;}
  .seller-btn.outline{background:#fff;border:1px solid var(--primary);color:var(--primary);}

  /* curated recommendation panel (distinct background) */
  .curated-wrap{
    margin:0 14px 0;padding:0 0 0 14px;border-radius:14px;
    background:linear-gradient(135deg,var(--secondary) 0%,#3d41a8 100%);
    box-shadow:none;
    overflow:hidden;box-sizing:border-box;
    max-height:0;opacity:0;
    transition:max-height .42s ease, opacity .32s ease .06s, margin-top .42s ease, padding-top .42s ease, padding-bottom .42s ease, box-shadow .3s ease;
  }
  .curated-wrap.show{
    margin-top:16px;padding-top:14px;padding-bottom:14px;
    max-height:280px;opacity:1;box-shadow:var(--shadow-2);
  }
  .curated-tag{
    font-size:9.5px;font-weight:700;letter-spacing:0.6px;color:rgba(255,255,255,0.7);margin-bottom:4px;
  }
  .curated-title{
    font-size:14.5px;font-weight:700;color:#fff;margin-bottom:11px;padding-right:14px;
  }
  .curated-scroll{padding-right:14px;}
  .curated-scroll .prod-card{
    background:#fff;border:none;box-shadow:0 4px 14px rgba(20,25,90,0.25);
  }

  /* product grid / scroll */
  .prod-scroll{display:flex;gap:11px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none;}
  .prod-scroll::-webkit-scrollbar{display:none;}
  .prod-grid{display:grid;grid-template-columns:1fr 1fr;gap:11px;}
  .prod-card{
    flex-shrink:0;width:136px;background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden;box-shadow:var(--shadow-1);
  }
  .prod-grid .prod-card{width:auto;}
  .prod-img{height:98px;background:linear-gradient(135deg,#EDE7D8,#DACDA2);display:flex;align-items:center;justify-content:center;color:#B7AC8E;}
  .prod-body{padding:9px 9px 11px;}
  .prod-name{font-size:11.5px;line-height:1.35;margin-bottom:5px;min-height:31px;}
  .prod-price{font-size:13px;font-weight:700;color:var(--teal-deep);}
  .prod-price span{font-size:10px;color:var(--muted);font-weight:400;}
  .prod-meta{display:flex;align-items:center;gap:4px;margin-top:5px;font-size:10px;color:var(--green);}

  /* trust strip */
  .trust-strip{
    margin:16px 14px 0;background:var(--dark);border-radius:12px;padding:14px 13px;
    display:flex;gap:12px;align-items:center;
  }
  .trust-badge{
    width:34px;height:34px;border-radius:50%;background:rgba(238,177,96,0.18);
    display:flex;align-items:center;justify-content:center;flex-shrink:0;color:var(--badge-star);
  }
  .trust-copy .t1{color:#fff;font-size:12.5px;font-weight:600;margin-bottom:2px;}
  .trust-copy .t2{color:#A9C9C4;font-size:10.5px;line-height:1.4;}

  /* value props */
  .value-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px;}
  .value-card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 11px;box-shadow:var(--shadow-1);}
  .value-icon{color:var(--secondary);margin-bottom:6px;}
  .value-title{font-size:11.5px;font-weight:700;color:var(--teal-deep);margin-bottom:2px;}
  .value-sub{font-size:10px;color:var(--muted);line-height:1.4;}

  /* bottom nav */
  .bottom-nav{
    display:flex;background:#fff;border-top:1px solid var(--line);padding:8px 4px 10px;margin-top:20px;
    position:sticky;bottom:0;
  }
  .nav-item{
    flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:8.8px;color:var(--muted);position:relative;
    text-align:center;line-height:1.15;padding:0 2px;
  }
  .nav-item.active{color:var(--teal-deep);font-weight:700;}
  .nav-item.active svg{color:var(--amber-deep);}
  .nav-badge{
    position:absolute;top:-3px;right:16px;width:8px;height:8px;border-radius:50%;background:var(--red);
  }
  .spacer{height:4px;}
</style>
</head>
<body>

<div class="controls">
  <h1>Merged Home / BuyerMY — dynamic homepage prototype</h1>
  <p class="sub">Toggle persona and landing source below.</p>

  <div class="control-group">
    <div class="control-label">PERSONA (identity signal)</div>

function setFeedback(val, btnEl){
  state.feedbackNegative = (val === 'down');
  const fb = document.getElementById('feedbackCardEl');
  const panel = document.getElementById('curatedPanel');
  if(btnEl){
    const siblings = btnEl.parentElement.querySelectorAll('.fa-btn');
    siblings.forEach(s=>s.classList.remove('fa-btn-active'));
    btnEl.classList.add('fa-btn-active');
  }
  if(!fb) return;
  // collapse the feedback card smoothly, no layout jitter: fix current height first, then animate to 0
  fb.style.maxHeight = fb.scrollHeight + 'px';
  requestAnimationFrame(()=>{
    fb.classList.add('collapsed');
    fb.style.maxHeight = '0px';
  });
  if(val === 'down' && panel){
    setTimeout(()=>{ panel.classList.add('show'); }, 260);
  }
}

      <div class="seller-info">
        <div class="seller-product-name">${s.name}</div>
        <div class="seller-price">${s.price}<span>${s.unit}</span></div>
        <div class="seller-specs">
          ${s.specs.map(sp=>`<div>${sp[0]}: <b>${sp[1]}</b></div>`).join('')}
        </div>
      </div>
    </div>
    <div class="seller-divider"></div>
    <div class="seller-company-row">
      <div>
        <div class="seller-company-name">${s.company}</div>
        <div class="seller-company-meta">${s.location} · ${s.years}</div>
      </div>
      <div class="seller-rating-wrap">
        <div class="seller-rating">${starRow(s.rating)}<span>${s.rating} (${s.reviews})</span></div>
        <div class="seller-response">${ICONS.phone} ${s.response} Response Rate</div>
      </div>
    </div>
    <div class="seller-actions">
      <div class="seller-btn primary">${ICONS.chat} Best Price</div>
      <div class="seller-btn outline">${ICONS.whatsapp} WhatsApp</div>
      <div class="seller-btn primary">${ICONS.phone} Call Now</div>
    </div>
  </div>`;
}

function moreSellersSection(){
  return `
  <div class="section">
    <div class="section-head"><div class="section-title">More sellers near you for Stainless Steel Storage Tanks</div></div>
    ${SELLERS.map(sellerCard).join('')}
  </div>`;
}

function buyersAlsoViewedSection(){
  return `
  <div class="section">
    <div class="section-head"><div class="section-title">Buyers also viewed</div><div class="section-link">See more</div></div>
    <div class="prod-scroll">
      ${productCard(TRENDING[1])}
      ${productCard(TRENDING[2])}
      ${productCard(TRENDING[4])}
    </div>
  </div>`;
}

function recentSection(){
  const title = state.persona==='expired' ? 'Continue browsing' : 'Recently viewed';
  return `
  <div class="section">
    <div class="section-head"><div class="section-title">${title}</div><div class="section-link">See more</div></div>
    <div class="prod-scroll">
      ${productCard(TRENDING[3])}
      ${productCard(TRENDING[0])}
      ${productCard(TRENDING[2])}
    </div>
  </div>`;
}

function productCard(p){
  return `
  <div class="prod-card">
    <div class="prod-img">${p.icon}</div>
    <div class="prod-body">
      <div class="prod-name">${p.name}</div>
      <div class="prod-price">${p.price} <span>${p.unit}</span></div>
      <div class="prod-meta">${ICONS.shield.replace('width="18" height="18"','width="11" height="11"')} Verified</div>
    </div>
  </div>`;
}

function trendingSection(){
  return `
  <div class="section">
    <div class="section-head"><div class="section-title">Trending on IndiaMART</div><div class="section-link">See more</div></div>
    <div class="prod-grid">
      ${TRENDING.map(productCard).join('')}
    </div>
  </div>`;
}

function categorySection(){
  return `
  <div class="section">
    <div class="section-head"><div class="section-title">Shop by category</div><div class="section-link">View all</div></div>
    <div class="cat-scroll">
      ${CATEGORIES.map(c=>`<div class="cat-item"><div class="cat-icon">${catIcon(c.path)}</div><div class="cat-label">${c.label}</div></div>`).join('')}
    </div>
  </div>`;
}

function industryGroup(ind){
  const cells = ind.items.map(it=>`
    <div class="ind-cell">
      <div class="ind-thumb">${it.icon}</div>
      <div class="ind-label">${it.label}</div>
    </div>`).join('');
  return `
  <div class="ind-group">
    <div class="ind-head">
      <div class="ind-head-thumb">${ind.icon}</div>
      <div class="ind-head-name">${ind.name}</div>
    </div>
    <div class="ind-grid">
      ${cells}
      <div class="ind-cell ind-more">View more &gt;</div>
    </div>
  </div>`;
}

function industrySection(){
  return `
  <div class="section">
    <div class="section-head"><div class="section-title">Explore by industry</div></div>
    ${INDUSTRIES.map(industryGroup).join('')}
  </div>`;
}

function trustStrip(){
  return `
  <div class="trust-strip">
    <div class="trust-badge">${ICONS.shield}</div>
    <div class="trust-copy"><div class="t1">Buy from TrustSEAL Verified suppliers</div><div class="t2">Background-checked sellers, verified business credentials</div></div>
  </div>`;
}

function valueProps(){
  return `
  <div class="section">
    <div class="section-head"><div class="section-title">Why buy on IndiaMART</div></div>
    <div class="value-grid">
      <div class="value-card"><div class="value-icon">${ICONS.user}</div><div class="value-title">6.8 crore+ buyers</div><div class="value-sub">Trust IndiaMART for sourcing every month</div></div>
      <div class="value-card"><div class="value-icon">${ICONS.post}</div><div class="value-title">Compare quotes free</div><div class="value-sub">Get up to 5 quotes before you decide</div></div>
      <div class="value-card"><div class="value-icon">${ICONS.shield}</div><div class="value-title">Verified suppliers</div><div class="value-sub">Business credentials checked upfront</div></div>
      <div class="value-card"><div class="value-icon">${ICONS.msg}</div><div class="value-title">Direct chat</div><div class="value-sub">Message sellers, no middlemen involved</div></div>
    </div>
  </div>`;
}

function bottomNav(){
  const items = [
    {icon:ICONS.home, label:'Home', active: true},
    {icon:ICONS.post, label:'Post RFQ', active:false},
    {icon:ICONS.msg, label:'Messages', active:false},
    {icon:ICONS.orders, label:'Orders', active:false, badge: state.persona!=='new'},
    {icon:ICONS.user, label:'My IndiaMART', active:false},
  ];
  return `
  <div class="bottom-nav">
    ${items.map(it=>`
      <div class="nav-item ${it.active?'active':''}">
        ${it.badge?'<div class="nav-badge"></div>':''}
        ${it.icon}
        ${it.label}
      </div>`).join('')}
  </div>`;
}

function render(){
  let html = topbar() + searchBar();
  const p = state.persona, s = state.source;

  if(p==='new'){
    if(s==='google'){
      html += chipRow();
      html += quickActions();
      html += signInNudge();
      html += trendingSection();
      html += categorySection();
      html += industrySection();
    } else {
      html += quickActions();
      html += signInNudge();
      html += trendingSection();
      html += categorySection();
      html += industrySection();
    }
    html += trustStrip();
    html += valueProps();
  }

  if(p==='active'){
    html += quickLinksRow();
    if(s==='internal'){
      html += rfqHero();
      html += recentSection();
      html += pastOrdersSection();
      html += moreSellersSection();
      html += buyersAlsoViewedSection();
      html += trendingSection();
      html += categorySection();
    } else {
      html += rfqMiniBanner();
      html += recentSection();
      html += pastOrdersSection();
      html += moreSellersSection();
      html += buyersAlsoViewedSection();
      html += trendingSection();
      html += categorySection();
    }
    html += trustStrip();
    html += valueProps();
  }

  if(p==='expired'){
    if(s==='internal'){
      html += feedbackCard();
      html += curatedSection();
      html += moreSellersSection();
      html += buyersAlsoViewedSection();
      html += pastOrdersSection();
      html += recentSection();
      html += trendingSection();
      html += categorySection();
    } else {
      html += recentSection();
      html += feedbackCard();
      html += curatedSection();
      html += moreSellersSection();
      html += pastOrdersSection();
      html += buyersAlsoViewedSection();
      html += trendingSection();
      html += categorySection();
    }
    html += trustStrip();
    html += valueProps();
  }

  html += '<div class="spacer"></div>' + bottomNav();
  document.getElementById('device').innerHTML = html;
}


function buildControls(){
  const pr = document.getElementById('personaRow');
  PERSONAS.forEach(p=>{
    const el = document.createElement('div');
    el.className = 'pill' + (state.persona===p.id?' active':'');
    el.textContent = p.label;
    el.onclick = ()=>{ state.persona = p.id; state.feedbackNegative=false; buildControls(); render(); };
    pr.appendChild(el);
  });
  pr.innerHTML=''; 
  PERSONAS.forEach(p=>{
    const el = document.createElement('div');
    el.className = 'pill' + (state.persona===p.id?' active':'');
    el.textContent = p.label;
    el.onclick = ()=>{ state.persona = p.id; state.feedbackNegative=false; buildControls(); render(); };
    pr.appendChild(el);
  });

  const sr = document.getElementById('sourceRow');
  sr.innerHTML='';
  SOURCES.forEach(s=>{
    const el = document.createElement('div');
    el.className = 'pill' + (state.source===s.id?' active':'');
    el.textContent = s.label;
    el.onclick = ()=>{ state.source = s.id; state.feedbackNegative=false; buildControls(); render(); };
    sr.appendChild(el);
  });
}

buildControls();
render();
</script>
</body>
</html>
